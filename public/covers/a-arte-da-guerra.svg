  <rect width="600" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="544" height="844" fill="none" stroke="#dc2626" stroke-width="1.5" opacity="0.5"/>

  <text x="300" y="180" text-anchor="middle" font-family="serif" font-size="14" letter-spacing="6" fill="#fca5a5" text-transform="uppercase">

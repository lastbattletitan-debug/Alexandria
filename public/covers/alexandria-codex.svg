<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c140a"/>
      <stop offset="50%" stop-color="#160803"/>
      <stop offset="100%" stop-color="#090301"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  
  <!-- Outer border -->
  <rect x="25" y="25" width="550" height="850" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <rect x="35" y="35" width="530" height="830" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>

  <!-- Corner Ornaments -->
  <circle cx="45" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="555" cy="45" r="4" fill="#f59e0b"/>
  <circle cx="45" cy="855" r="4" fill="#f59e0b"/>
  <circle cx="555" cy="855" r="4" fill="#f59e0b"/>

  <!-- Header text -->
  <text x="300" y="160" text-anchor="middle" font-family="serif" font-size="16" letter-spacing="8" fill="#f59e0b" font-weight="bold" text-transform="uppercase">
    Alexandria Codex
  </text>
  <line x1="220" y1="185" x2="380" y2="185" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>

  <!-- Main Title -->
  <text x="300" y="320" text-anchor="middle" font-family="serif" font-size="44" font-weight="bold" fill="#fffbeb" filter="url(#shadow)">
    O LIVRO DO
  </text>
  <text x="300" y="380" text-anchor="middle" font-family="serif" font-size="46" font-weight="bold" fill="#fde68a" filter="url(#shadow)">
    CONHECIMENTO
  </text>

  <!-- Central Seal Symbol -->
  <g transform="translate(300, 520)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="65" fill="#160803" stroke="url(#gold)" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
    <polygon points="0,-45 39,22 -39,22" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <polygon points="0,45 -39,-22 39,-22" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
  </g>

  <!-- Subtitle and Author -->
  <text x="300" y="720" text-anchor="middle" font-family="serif" font-size="18" font-style="italic" fill="#fde68a" opacity="0.9">
    Arquitetura dos Grandes Pensamentos
  </text>
  <text x="300" y="780" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" letter-spacing="4" fill="#f59e0b">
    VOLUME I • CODEX
  </text>
</svg>

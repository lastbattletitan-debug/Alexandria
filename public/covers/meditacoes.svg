<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c26"/>
      <stop offset="60%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="url(#bg)"/>
  <rect x="30" y="30" width="540" height="840" fill="none" stroke="url(#silver)" stroke-width="1.5" opacity="0.4"/>

  <text x="300" y="180" text-anchor="middle" font-family="serif" font-size="14" letter-spacing="6" fill="#94a3b8" text-transform="uppercase">
    FILOSOFIA ESTÓICA
  </text>
  <line x1="240" y1="205" x2="360" y2="205" stroke="#94a3b8" stroke-width="1" opacity="0.6"/>

  <text x="300" y="340" text-anchor="middle" font-family="serif" font-size="52" font-weight="bold" fill="#f8fafc" letter-spacing="2">
    MEDITAÇÕES
  </text>
  
  <g transform="translate(300, 510)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#silver)" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#silver)" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <path d="M-30,-20 L0,30 L30,-20 Z" fill="none" stroke="url(#silver)" stroke-width="2"/>
    <circle cx="0" cy="-20" r="6" fill="#94a3b8"/>
  </g>

  <text x="300" y="710" text-anchor="middle" font-family="serif" font-size="22" font-weight="600" fill="#cbd5e1">
    MARCO AURÉLIO
  </text>
  <text x="300" y="745" text-anchor="middle" font-family="sans-serif" font-size="11" letter-spacing="4" fill="#64748b" text-transform="uppercase">
    Imperador de Roma
  </text>
</svg>
